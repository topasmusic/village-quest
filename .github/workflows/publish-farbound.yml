name: Transfer platform credentials encrypted to central publishing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-24.04
    steps:
      - name: Install encryption library
        run: python3 -m pip install 'PyNaCl==1.5.0'
      - name: Seal existing credentials for destination repository only
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,base64
          from pathlib import Path
          from nacl.public import PublicKey,SealedBox
          key=PublicKey(base64.b64decode('Bo/Ts0s+jjVJtnTz8bl++WSjXMpwSnDUqKBnqLjqfg4='))
          result={}
          for name in ['MODRINTH_TOKEN','CURSEFORGE_TOKEN']:
              value=os.environ[name]
              if not value: raise SystemExit('Required source credential absent')
              result[name]={'key_id':'3380204578043523366','encrypted_value':base64.b64encode(SealedBox(key).encrypt(value.encode())).decode()}
          Path('sealed-secrets.json').write_text(json.dumps(result))
          print('Two credentials sealed for topasmusic/topas-mod-publishing; no plaintext exported.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: destination-sealed-secrets
          path: sealed-secrets.json
          retention-days: 1