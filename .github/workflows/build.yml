name: Build maintained lines

on: [pull_request, push]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4
      - name: Validate resources and translations
        run: python3 tools/validate_resources.py

  build:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: 26.2
            java: 25
          - project: 26.1.2
            java: 25
          - project: 1.21.11
            java: 21
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: microsoft
      - name: Make Gradle wrapper executable
        working-directory: ${{ matrix.project }}
        run: chmod +x ./gradlew
      - name: Build Village Quest ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: ./gradlew build
      - name: Capture ${{ matrix.project }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: village-quest-${{ matrix.project }}
          path: ${{ matrix.project }}/build/libs/
